<!doctype html>
<meta charset="utf-8" />
<body style="margin:0;background:transparent">
<canvas id="c" width="720" height="720"></canvas>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
<script type="module">
import * as THREE from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

const SIZE = 720;
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(SIZE, SIZE, false);
renderer.setClearColor(0x000000, 0);
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const pmrem = new THREE.PMREMGenerator(renderer);
const scene = new THREE.Scene();
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.7;

const camera = new THREE.PerspectiveCamera(28, 1, 0.1, 100);
camera.position.set(0, 0, 10);

const key = new THREE.DirectionalLight(0xffffff, 2.4);
key.position.set(3.5, 5, 6);
const fill = new THREE.DirectionalLight(0x8fb0ff, 0.9);
fill.position.set(-5, -2.5, 3);
const rim = new THREE.DirectionalLight(0xffffff, 0.8);
rim.position.set(-3, 4, -4);
scene.add(key, fill, rim);

const blue = { main: "#1d5bff", light: "#6fa0ff", deep: "#0c35b5", pale: "#cfe0ff" };
const mat = (color, extra = {}) =>
  new THREE.MeshPhysicalMaterial({ color, roughness: 0.24, metalness: 0.04, clearcoat: 1, clearcoatRoughness: 0.09, ...extra });
const mesh = (geo, m, pos = [0, 0, 0], rot = [0, 0, 0]) => {
  const o = new THREE.Mesh(geo, m);
  o.position.set(...pos);
  o.rotation.set(...rot);
  return o;
};

const shapes = {
  torus: () => {
    const g = new THREE.Group();
    g.add(mesh(new THREE.TorusGeometry(1, 0.46, 96, 200), mat(blue.main), [0, 0, 0], [0.95, 0.35, -0.25]));
    return g;
  },
  knot: () => {
    const g = new THREE.Group();
    g.add(mesh(new THREE.TorusKnotGeometry(0.95, 0.3, 320, 56, 2, 3), mat(blue.main), [0, 0, 0], [0.5, 0.6, 0.1]));
    return g;
  },
  capsules: () => {
    const g = new THREE.Group();
    const m = mat(blue.main);
    g.add(mesh(new THREE.CapsuleGeometry(0.3, 1.5, 24, 48), m, [-0.45, 0.1, 0], [0, 0, 0.55]));
    g.add(mesh(new THREE.CapsuleGeometry(0.3, 1.5, 24, 48), m, [0.5, 0.15, 0.1], [0, 0, -0.6]));
    g.add(mesh(new THREE.CapsuleGeometry(0.34, 1.3, 24, 48), mat(blue.light), [0, -0.35, 0.35], [0, 0, 0.05]));
    g.add(mesh(new THREE.SphereGeometry(0.5, 64, 64), mat(blue.main), [0.05, -0.75, 0.55]));
    return g;
  },
  planet: () => {
    const g = new THREE.Group();
    g.add(mesh(new THREE.SphereGeometry(1.1, 96, 96), mat(blue.main)));
    g.add(mesh(new THREE.TorusGeometry(1.95, 0.13, 48, 280), mat(blue.pale), [0, 0, 0], [1.25, 0.15, 0.35]));
    return g;
  },
  cube: () => {
    const g = new THREE.Group();
    g.add(mesh(new RoundedBoxGeometry(1.7, 1.7, 1.7, 10, 0.34), mat(blue.main), [0, 0, 0], [0.55, 0.8, 0.1]));
    return g;
  },
  gem: () => {
    const g = new THREE.Group();
    g.add(mesh(new THREE.IcosahedronGeometry(1.3, 1), mat(blue.main, { flatShading: true, roughness: 0.16 }), [0, 0, 0], [0.4, 0.5, 0.2]));
    return g;
  },
  rings: () => {
    const g = new THREE.Group();
    g.add(mesh(new THREE.TorusGeometry(1.25, 0.3, 64, 160), mat(blue.deep), [0, -0.85, 0], [1.35, 0, 0.1]));
    g.add(mesh(new THREE.TorusGeometry(0.98, 0.3, 64, 160), mat(blue.main), [0, 0, 0.05], [1.35, 0, -0.05]));
    g.add(mesh(new THREE.TorusGeometry(0.7, 0.3, 64, 160), mat(blue.light), [0, 0.85, 0.1], [1.35, 0, 0.1]));
    return g;
  },
  duo: () => {
    const g = new THREE.Group();
    g.add(mesh(new THREE.SphereGeometry(1.05, 96, 96), mat(blue.main), [-0.35, -0.2, 0]));
    g.add(mesh(new THREE.SphereGeometry(0.6, 96, 96), mat(blue.light), [1.0, 0.75, 0.3]));
    g.add(mesh(new THREE.SphereGeometry(0.28, 64, 64), mat(blue.deep), [0.75, -0.95, 0.5]));
    return g;
  },
};

let current = null;
window.renderShape = (name) => {
  if (current) scene.remove(current);
  current = shapes[name]();
  const box = new THREE.Box3().setFromObject(current);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  current.position.sub(center);
  const wrap = new THREE.Group();
  wrap.add(current);
  const s = 4.1 / Math.max(size.x, size.y);
  wrap.scale.setScalar(s);
  scene.add(wrap);
  current = wrap;
  renderer.render(scene, camera);
  return canvas.toDataURL("image/webp", 0.9);
};
window.shapeNames = Object.keys(shapes);
window.ready = true;
</script>
